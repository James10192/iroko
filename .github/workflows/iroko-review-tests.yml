name: IROKO Review experiments
on:
  pull_request:
    paths:
      - "src/review/**"
      - "src/commands/review.ts"
      - "src/cli.ts"
      - "docs/iroko-review/**"
      - "package.json"
      - ".github/workflows/iroko-review-tests.yml"
jobs:
  review-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:review
      - run: pnpm build
